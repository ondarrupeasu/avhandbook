  <style>
/* Scrollbars finos unificados (estilo casa) */
*{scrollbar-width:thin;scrollbar-color:rgba(140,140,150,.45) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,140,150,.45);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,140,150,.7)}
::-webkit-scrollbar-corner{background:transparent}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #0e0f12; min-height: 100%; }
body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#root { min-height: 100vh; }

/* ── Capa de pulido global (micro-interacciones, foco, tipografía) ── */
:root{ --ease: cubic-bezier(.22,.61,.36,1); --coral:#ff5a4d; }
body{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
button{ transition: transform .12s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease); }
button:hover{ filter:brightness(1.08); }
button:active{ transform:translateY(1px) scale(.985); }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--coral); outline-offset:2px; border-radius:6px; }
input[type=range]{ cursor:pointer; }
::selection{ background:rgba(255,90,77,.28); }
@keyframes avh-in{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
.avh-fade{ animation: avh-in .34s var(--ease) both; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>
